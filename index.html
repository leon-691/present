<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Untuk Adik</title>
  <meta name="description" content="Sebuah kejutan kecil, dibuat khusus untukmu." />

  <!-- Ini kado pribadi, bukan halaman publik -- jangan sampai terindeks
       mesin pencari atau muncul di hasil pencarian orang lain. -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- Supaya saat link ini dibagikan lewat WhatsApp/Instagram, preview-nya
       rapi -- tanpa membocorkan isi kejutannya. Judul tab asli (personal)
       baru diset lewat JS di main.js, khusus untuk yang benar-benar buka. -->
  <meta property="og:title" content="Untuk Adik" />
  <meta property="og:description" content="Sebuah kejutan kecil, dibuat khusus untukmu." />
  <meta property="og:type" content="website" />

  <meta name="theme-color" content="#14100b" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Favicon -- lensa/aperture kecil, identitas baru, inline SVG tanpa file tambahan -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314100b'/%3E%3Ccircle cx='50' cy='50' r='34' fill='none' stroke='%23e2963f' stroke-width='4' opacity='0.55'/%3E%3Ccircle cx='50' cy='50' r='19' fill='%23e2963f'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="src/styles/tokens.css" />
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/styles/components.css" />
  <link rel="stylesheet" href="src/styles/sections.css" />
  <link rel="stylesheet" href="src/styles/motion.css" />
</head>
<body>

  <div class="stage">
    <div class="vignette" aria-hidden="true"></div>
    <canvas class="grain-canvas" aria-hidden="true"></canvas>
    <canvas class="ember-canvas motion-decorative" aria-hidden="true"></canvas>

    <div class="letterbox" aria-hidden="true">
      <div class="letterbox__bar letterbox__bar--top"></div>
      <div class="letterbox__bar letterbox__bar--bottom"></div>
      <div class="light-leak"></div>
    </div>

    <div class="timecode" aria-hidden="true">
      <span class="timecode__track"><span class="timecode__fill"></span></span>
      <span class="timecode__label">01 / 09</span>
    </div>

    <div class="now-playing is-paused" data-music-widget>
      <button type="button" class="now-playing__toggle" data-music-toggle aria-label="Putar musik latar">▶</button>
      <div class="now-playing__meta">
        <p class="now-playing__title" data-music-title></p>
        <p class="now-playing__subtitle" data-music-subtitle></p>
      </div>
      <div class="now-playing__bars motion-decorative" aria-hidden="true"><span></span><span></span><span></span></div>
      <audio data-music-audio preload="none"></audio>
    </div>

    <!-- Tombol kecil override preferensi motion -- lihat motionPreference.js
         & README soal kenapa ini penting untuk Android. -->
    <button type="button" class="motion-toggle" data-motion-toggle aria-label="Ganti mode efek visual">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <circle cx="12" cy="12" r="3" />
        <path d="M12 3v3M12 18v3M3 12h3M18 12h3" />
      </svg>
    </button>

    <main class="screen">

      <!-- 1. GERBANG KATA SANDI -->
      <section class="act act--gerbang is-active" data-act="gerbang" aria-label="Gerbang kata sandi">
        <div class="viewfinder">
          <span class="corner corner--tl" aria-hidden="true"></span>
          <span class="corner corner--tr" aria-hidden="true"></span>
          <span class="corner corner--bl" aria-hidden="true"></span>
          <span class="corner corner--br" aria-hidden="true"></span>
          <h1 data-gate-subtitle></h1>
          <div class="frame-dots" data-gate-dots aria-hidden="true"></div>
          <div class="keypad" data-gate-keypad></div>
          <p class="hint-text" data-gate-hint role="status" aria-live="polite" aria-atomic="true"></p>
        </div>
      </section>

      <!-- 2. SAPAAN -->
      <section class="act act--sapaan" data-act="sapaan" aria-label="Sapaan">
        <h1 data-key="greetingText"></h1>
        <button type="button" class="btn btn--primary" data-next data-key="greetingButton"></button>
      </section>

      <!-- 3. KONFIRMASI (yes/no + reaksi tipografi kinetik kalau "noo") -->
      <section class="act act--konfirmasi" data-act="konfirmasi" aria-label="Konfirmasi">
        <div data-confirm-question>
          <h2 data-confirm-question-text></h2>
          <div class="confirm-actions">
            <button type="button" class="btn btn--primary" data-confirm-yes></button>
            <button type="button" class="btn btn--ghost" data-confirm-no></button>
          </div>
        </div>
        <div data-confirm-reaction hidden>
          <h2 data-confirm-reaction-text></h2>
          <button type="button" class="btn btn--ghost" data-confirm-back></button>
        </div>
      </section>

      <!-- 4. REVEAL UMUR -->
      <section class="act act--reveal" data-act="reveal" aria-label="Umur">
        <p class="eyebrow" data-reveal-prefix></p>
        <div class="reveal-number" data-reveal-number>0</div>
        <h2 data-reveal-suffix></h2>
        <button type="button" class="btn btn--primary" data-next data-reveal-button></button>
      </section>

      <!-- 5. PESAN UTAMA -->
      <section class="act" data-act="pesan-utama" aria-label="Pesan utama">
        <div class="title-card viewfinder">
          <span class="corner corner--tl" aria-hidden="true"></span>
          <span class="corner corner--tr" aria-hidden="true"></span>
          <span class="corner corner--bl" aria-hidden="true"></span>
          <span class="corner corner--br" aria-hidden="true"></span>
          <h2 data-key="mainMessageTitle"></h2>
          <p data-key="mainMessageBody"></p>
        </div>
        <button type="button" class="btn btn--primary" data-next data-key="mainMessageButton"></button>
      </section>

      <!-- 6. TRANSISI -->
      <section class="act" data-act="transisi" aria-label="Transisi">
        <p class="transition-text" data-key="transitionText"></p>
        <button type="button" class="btn btn--ghost" data-next data-key="continueLabel"></button>
      </section>

      <!-- 7. KENANGAN -- dibuat JS, satu babak per foto+kalimat, persis
           referensi (bukan grid foto terpisah dari teks) -->
      <div data-memory-slot></div>

      <!-- 8. LAGU -->
      <section class="act act--song" data-act="lagu" aria-label="Lagu">
        <h2 data-key="songTitle"></h2>
        <p data-key="songSubtitle"></p>
        <div class="song-frame">
          <iframe
            data-key-src="spotifyEmbedSrc"
            title="Playlist Spotify"
            style="height: 300px;"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy"
          ></iframe>
        </div>
        <p class="section--song__note">Kalau player di atas kosong, ganti dulu link playlist-nya di <code>content.js</code>.</p>
        <button type="button" class="btn btn--primary" data-next data-key="continueLabel"></button>
      </section>

      <!-- 9. SURAT PANJANG (scroll internal, tombol kembali ke awal di ujungnya) -->
      <section class="act section--letter" data-act="surat" aria-label="Surat">
        <div class="letter-scroll" data-letter-scroll>
          <h2 class="letter-heading" data-letter-heading></h2>
          <div class="letter-body" data-letter-body></div>
          <button type="button" class="btn btn--ghost" data-restart></button>
        </div>
      </section>

    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module" src="src/scripts/main.js"></script>
</body>
</html>
